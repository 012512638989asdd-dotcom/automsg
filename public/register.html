<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب — automsg</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a56ff'/><text y='.9em' font-size='70' x='15' fill='white' font-weight='bold'>A</text></svg>">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 30 L20 6 L34 30" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M11 22 L29 22" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <circle cx="30" cy="28" r="7" fill="#1a56ff" stroke="white" stroke-width="2"/>
          <circle cx="27.5" cy="28" r="1" fill="white"/>
          <circle cx="30" cy="28" r="1" fill="white"/>
          <circle cx="32.5" cy="28" r="1" fill="white"/>
        </svg>
      </div>
      <h1>إنشاء حساب جديد</h1>
      <p>انضم إلى <span style="color:var(--blue3);font-weight:700">automsg</span></p>
    </div>

    <form id="registerForm">
      <div class="form-group" style="margin-bottom:.85rem">
        <label>اسم المستخدم</label>
        <input type="text" id="username" placeholder="3 أحرف على الأقل" required autocomplete="username" minlength="3">
      </div>
      <div class="form-group" style="margin-bottom:.85rem">
        <label>كلمة المرور</label>
        <div class="input-row">
          <input type="password" id="password" placeholder="6 أحرف على الأقل" required autocomplete="new-password" minlength="6">
          <button type="button" class="btn btn-secondary btn-icon" id="togglePass">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:1.25rem">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" required autocomplete="new-password">
      </div>
      <div id="regError" style="color:var(--red);font-size:.82rem;margin-bottom:.75rem;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="regBtn">
        <span id="regText">إنشاء الحساب</span>
      </button>
    </form>

    <div style="text-align:center;margin-top:1rem;font-size:.82rem;color:var(--text2)">
      لديك حساب بالفعل؟
      <a href="/" style="color:var(--blue3);font-weight:700;text-decoration:none">تسجيل الدخول</a>
    </div>

    <div class="auth-brand">© 2025 <span>automsg</span> — جميع الحقوق محفوظة</div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  document.getElementById('togglePass').onclick = () => {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  };

  document.getElementById('registerForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const txt = document.getElementById('regText');
    const err = document.getElementById('regError');
    const pass = document.getElementById('password').value;
    const confirmVal = document.getElementById('confirmPassword').value;
    err.style.display = 'none';
    if (pass !== confirmVal) {
      err.textContent = 'كلمتا المرور غير متطابقتين';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    txt.innerHTML = '<span class="spinner"></span> جاري الإنشاء...';
    try {
      await api.post('/api/auth/register', {
        username: document.getElementById('username').value.trim(),
        password: pass
      });
      location.href = '/dashboard';
    } catch (e) {
      err.textContent = e.message || 'فشل إنشاء الحساب';
      err.style.display = 'block';
      btn.disabled = false;
      txt.textContent = 'إنشاء الحساب';
    }
  };
</script>
</body>
</html>
