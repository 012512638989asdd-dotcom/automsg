<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التوكنات — automsg</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a56ff'/><text y='.9em' font-size='70' x='15' fill='white' font-weight='bold'>A</text></svg>">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 36 36" width="32" height="32" fill="none">
        <path d="M5 27 L18 5 L31 27" stroke="#1a56ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 20 L26 20" stroke="#1a56ff" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="27" cy="26" r="6" fill="#0c1021" stroke="#1a56ff" stroke-width="2"/>
        <circle cx="24.8" cy="26" r=".9" fill="#3b82f6"/>
        <circle cx="27" cy="26" r=".9" fill="#3b82f6"/>
        <circle cx="29.2" cy="26" r=".9" fill="#3b82f6"/>
      </svg>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="nav-tooltip">لوحة التحكم</span>
      </a>
      <a href="/tokens" class="nav-item" data-page="tokens">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <span class="nav-tooltip">التوكنات</span>
      </a>
      <a href="/tasks" class="nav-item" data-page="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="nav-tooltip">المهام</span>
      </a>
      <a href="/logs" class="nav-item" data-page="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="nav-tooltip">السجلات</span>
      </a>
      <a href="/profile" class="nav-item" data-page="profile" title="الملف الشخصي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-tooltip">الملف الشخصي</span>
      </a>
      <a href="/admin" class="nav-item admin-only" data-page="admin" title="الإدارة" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="nav-tooltip">الإدارة</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button onclick="logout()" class="nav-item" style="background:none;border:none;cursor:pointer;width:46px;height:46px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="nav-tooltip">تسجيل الخروج</span>
      </button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <a href="/dashboard" class="topbar-brand">
        <svg viewBox="0 0 28 28" width="24" height="24" fill="none">
          <path d="M4 22 L14 4 L24 22" stroke="#1a56ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 16 L20 16" stroke="#1a56ff" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="21" cy="21" r="5" fill="#0c1021" stroke="#1a56ff" stroke-width="1.8"/>
          <circle cx="19.2" cy="21" r=".75" fill="#3b82f6"/>
          <circle cx="21" cy="21" r=".75" fill="#3b82f6"/>
          <circle cx="22.8" cy="21" r=".75" fill="#3b82f6"/>
        </svg>
        <span class="brand-name">auto<span>msg</span></span>
      </a>
      <div class="topbar-search">
        <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" placeholder="بحث...">
      </div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></button>
        <button class="topbar-icon-btn" id="userBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
      </div>
    </header>

    <div class="content">
      <div class="page-header">
        <div><h1>إدارة التوكنات</h1><p>أضف وأدر توكنات Discord الخاصة بك</p></div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <div class="card-header"><h2>إضافة توكن جديد</h2></div>
        <div class="card-body">
          <form id="addTokenForm">
            <div class="form-grid">
              <div class="form-group">
                <label>قيمة التوكن <span style="color:var(--red)">*</span></label>
                <div class="input-row">
                  <input type="password" id="tokenValue" placeholder="أدخل توكن Discord..." required>
                  <button type="button" class="btn btn-secondary btn-icon" id="showToken">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
                <small>يبدأ عادةً بـ MTxxxxxxx أو Nxxxxxxxx أو Oxxxxxxx</small>
              </div>
              <div class="form-group">
                <label>اسم مميز (اختياري)</label>
                <input type="text" id="tokenLabel" placeholder="مثال: حساب رئيسي">
              </div>
            </div>
            <div style="margin-top:1rem">
              <button type="submit" class="btn btn-primary" id="addTokenBtn">
                <span id="addTokenText">إضافة التوكن</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>قائمة التوكنات</h2>
          <span id="tokensCount" style="font-size:.78rem;color:var(--text3)"></span>
          <button onclick="loadTokens()" class="btn btn-secondary btn-sm">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>الاسم المميز</th><th>قيمة التوكن</th><th>الحالة</th><th>تاريخ الإضافة</th><th>الإجراءات</th></tr></thead>
            <tbody id="tokensList">
              <tr><td colspan="6"><div class="empty"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let tokens = [];

(async () => {
  const me = await authGuard();
  if (!me) return;
  document.getElementById('userBtn').title = me.username;
  initSidebar('tokens');
  showAdminNav(me.isAdmin);
  await loadTokens();
})();

document.getElementById('showToken').onclick = () => {
  const i = document.getElementById('tokenValue');
  i.type = i.type === 'password' ? 'text' : 'password';
};

document.getElementById('addTokenForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('addTokenBtn');
  const txt = document.getElementById('addTokenText');
  btn.disabled = true;
  txt.innerHTML = '<span class="spinner"></span> جاري الإضافة...';
  try {
    await api.post('/api/tokens', {
      tokenValue: document.getElementById('tokenValue').value.trim(),
      label:      document.getElementById('tokenLabel').value.trim() || undefined
    });
    toasts.success('تم إضافة التوكن بنجاح ✓');
    document.getElementById('tokenValue').value = '';
    document.getElementById('tokenLabel').value = '';
    await loadTokens();
  } catch (e) {
    toasts.error(e.message || 'فشل الإضافة');
  } finally {
    btn.disabled = false;
    txt.textContent = 'إضافة التوكن';
  }
};

async function loadTokens() {
  try {
    tokens = await api.get('/api/tokens');
    document.getElementById('tokensCount').textContent = `(${tokens.length} توكن)`;
    renderTokens();
  } catch (e) { toasts.error('فشل تحميل التوكنات'); }
}

function renderTokens() {
  const tbody = document.getElementById('tokensList');
  if (!tokens.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">🔑</div><h3>لا توجد توكنات</h3><p>أضف توكنك الأول أعلاه</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = tokens.map((t, i) => {
    const statusMap   = { active: 'badge-active', invalid: 'badge-invalid', unknown: 'badge-unknown' };
    const statusLabel = { active: 'صالح', invalid: 'غير صالح', unknown: 'غير معروف' };
    return `<tr>
      <td style="color:var(--text3)">${i+1}</td>
      <td style="font-weight:600">${t.label || '<span style="color:var(--text3)">—</span>'}</td>
      <td class="token-mask" title="${t.tokenValue}">${maskToken(t.tokenValue)}</td>
      <td><span class="badge ${statusMap[t.status] || 'badge-unknown'}"><span class="badge-dot"></span>${statusLabel[t.status] || t.status}</span></td>
      <td style="color:var(--text3)">${fmtDate(t.createdAt)}</td>
      <td>
        <div style="display:flex;gap:.35rem">
          <button onclick="testToken(${t.id})" class="btn btn-secondary btn-sm" title="اختبار">اختبار</button>
          <button onclick="deleteToken(${t.id})" class="btn btn-danger btn-sm btn-icon" title="حذف">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function testToken(id) {
  const btn = event.target.closest('button');
  btn.disabled = true;
  try {
    const r = await api.post(`/api/tokens/${id}/test`);
    if (r.valid) toasts.success(r.message || 'التوكن صالح ✓');
    else toasts.error(r.message || 'التوكن غير صالح');
    await loadTokens();
  } catch (e) { toasts.error(e.message); }
  finally { btn.disabled = false; }
}

async function deleteToken(id) {
  if (!await confirm('هل تريد حذف هذا التوكن وكل المهام المرتبطة به؟', 'حذف التوكن')) return;
  try {
    await api.delete(`/api/tokens/${id}`);
    toasts.success('تم حذف التوكن');
    await loadTokens();
  } catch (e) { toasts.error(e.message); }
}
</script>
</body>
</html>
