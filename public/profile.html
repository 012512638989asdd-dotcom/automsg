<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي — automsg</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a56ff'/><text y='.9em' font-size='70' x='15' fill='white' font-weight='bold'>A</text></svg>">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 36 36" width="32" height="32" fill="none">
        <path d="M5 27 L18 5 L31 27" stroke="#1a56ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 20 L26 20" stroke="#1a56ff" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="27" cy="26" r="6" fill="#0c1021" stroke="#1a56ff" stroke-width="2"/>
        <circle cx="24.8" cy="26" r=".9" fill="#3b82f6"/>
        <circle cx="27" cy="26" r=".9" fill="#3b82f6"/>
        <circle cx="29.2" cy="26" r=".9" fill="#3b82f6"/>
      </svg>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-page="dashboard" title="لوحة التحكم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="nav-tooltip">لوحة التحكم</span>
      </a>
      <a href="/tokens" class="nav-item" data-page="tokens" title="التوكنات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <span class="nav-tooltip">التوكنات</span>
      </a>
      <a href="/tasks" class="nav-item" data-page="tasks" title="المهام">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="nav-tooltip">المهام</span>
      </a>
      <a href="/logs" class="nav-item" data-page="logs" title="السجلات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span class="nav-tooltip">السجلات</span>
      </a>
      <a href="/profile" class="nav-item" data-page="profile" title="الملف الشخصي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-tooltip">الملف الشخصي</span>
      </a>
      <a href="/admin" class="nav-item admin-only" data-page="admin" title="الإدارة" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="nav-tooltip">الإدارة</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button onclick="logout()" class="nav-item" title="تسجيل الخروج" style="background:none;border:none;cursor:pointer;width:46px;height:46px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="nav-tooltip">تسجيل الخروج</span>
      </button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <a href="/dashboard" class="topbar-brand">
        <svg viewBox="0 0 28 28" width="26" height="26" fill="none">
          <path d="M4 22 L14 4 L24 22" stroke="#1a56ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 16 L20 16" stroke="#1a56ff" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="21" cy="21" r="5" fill="#0c1021" stroke="#1a56ff" stroke-width="1.8"/>
          <circle cx="19.2" cy="21" r=".75" fill="#3b82f6"/>
          <circle cx="21" cy="21" r=".75" fill="#3b82f6"/>
          <circle cx="22.8" cy="21" r=".75" fill="#3b82f6"/>
        </svg>
        <span class="brand-name">auto<span>msg</span></span>
      </a>
      <div class="topbar-actions">
        <button class="topbar-icon-btn notif-btn" title="إشعارات" id="notifBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot" style="display:none"></span>
        </button>
        <div class="avatar-topbar" id="topbarAvatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="page-header">
        <h1 class="page-title">الملف الشخصي</h1>
        <p class="page-sub">إدارة بياناتك الشخصية وكلمة المرور</p>
      </div>

      <div class="profile-grid">
        <!-- Avatar Card -->
        <div class="card profile-avatar-card">
          <div class="card-header"><h2>الصورة الشخصية</h2></div>
          <div class="card-body" style="display:flex;flex-direction:column;align-items:center;gap:1.5rem">
            <div class="avatar-circle" id="avatarCircle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div style="text-align:center">
              <div class="username-display" id="usernameDisplay">—</div>
              <div class="role-badge" id="roleBadge"></div>
            </div>
            <label class="btn btn-secondary" style="cursor:pointer;width:100%;text-align:center">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-left:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              رفع صورة جديدة
              <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
            </label>
            <p style="font-size:.75rem;color:var(--text3);text-align:center">PNG, JPG, GIF, WebP — حجم أقصى 5MB</p>
          </div>
        </div>

        <!-- Info Card -->
        <div class="card">
          <div class="card-header"><h2>معلومات الحساب</h2></div>
          <div class="card-body">
            <div class="info-row">
              <span class="info-label">اسم المستخدم</span>
              <span class="info-val mono" id="infoUsername">—</span>
            </div>
            <div class="info-row">
              <span class="info-label">تاريخ الإنشاء</span>
              <span class="info-val" id="infoCreated">—</span>
            </div>
            <div class="info-row">
              <span class="info-label">الصلاحية</span>
              <span class="info-val" id="infoRole">—</span>
            </div>
          </div>
        </div>

        <!-- Change Password Card -->
        <div class="card" style="grid-column: 1 / -1">
          <div class="card-header"><h2>تغيير كلمة المرور</h2></div>
          <div class="card-body">
            <form id="pwdForm" style="display:grid;gap:1rem;max-width:480px">
              <div class="form-group">
                <label class="form-label">كلمة المرور الحالية</label>
                <div class="input-wrap">
                  <input type="password" id="currentPwd" class="form-input" placeholder="أدخل كلمة المرور الحالية">
                  <button type="button" class="eye-btn" onclick="togglePwd('currentPwd',this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">كلمة المرور الجديدة</label>
                <div class="input-wrap">
                  <input type="password" id="newPwd" class="form-input" placeholder="6 أحرف على الأقل">
                  <button type="button" class="eye-btn" onclick="togglePwd('newPwd',this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">تأكيد كلمة المرور الجديدة</label>
                <div class="input-wrap">
                  <input type="password" id="confirmPwd" class="form-input" placeholder="أعد إدخال كلمة المرور الجديدة">
                  <button type="button" class="eye-btn" onclick="togglePwd('confirmPwd',this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" id="pwdBtn">حفظ كلمة المرور</button>
            </form>
          </div>
        </div>

        <!-- Notifications Card -->
        <div class="card" style="grid-column: 1 / -1">
          <div class="card-header">
            <h2>الإشعارات</h2>
            <button class="btn btn-secondary btn-sm" onclick="markAllRead()">تحديد الكل كمقروء</button>
          </div>
          <div id="notifList">
            <div class="empty"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let me;
(async () => {
  me = await authGuard();
  if (!me) return;
  initSidebar('profile');
  showAdminNav(me.isAdmin);
  await loadProfile();
  await loadNotifications();
  await loadUnreadCount();
})();

async function loadProfile() {
  try {
    const p = await api.get('/api/profile');
    document.getElementById('usernameDisplay').textContent = p.username;
    document.getElementById('infoUsername').textContent = p.username;
    document.getElementById('infoCreated').textContent = fmtDate(p.createdAt);
    const roleEl = document.getElementById('infoRole');
    const badgeEl = document.getElementById('roleBadge');
    if (p.isAdmin) {
      roleEl.innerHTML = '<span class="badge" style="background:rgba(245,158,11,.15);color:#f59e0b;border-color:rgba(245,158,11,.3)"><span class="badge-dot" style="background:#f59e0b"></span>مشرف</span>';
      badgeEl.innerHTML = '<span class="role-tag admin-tag">مشرف</span>';
    } else {
      roleEl.innerHTML = '<span class="badge badge-success"><span class="badge-dot"></span>مستخدم</span>';
      badgeEl.innerHTML = '<span class="role-tag user-tag">مستخدم</span>';
    }
    if (p.avatarPath) {
      document.getElementById('avatarCircle').innerHTML = `<img src="${p.avatarPath}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      updateTopbarAvatar(p.avatarPath);
    }
  } catch(e) { toasts.error('فشل تحميل البيانات'); }
}

async function uploadAvatar(input) {
  if (!input.files[0]) return;
  const fd = new FormData();
  fd.append('avatar', input.files[0]);
  try {
    const r = await api.post('/api/profile/avatar', fd);
    document.getElementById('avatarCircle').innerHTML = `<img src="${r.avatarPath}?t=${Date.now()}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    updateTopbarAvatar(r.avatarPath + '?t=' + Date.now());
    toasts.success('تم رفع الصورة بنجاح ✓');
  } catch(e) { toasts.error(e.message || 'فشل رفع الصورة'); }
}

function updateTopbarAvatar(src) {
  const el = document.getElementById('topbarAvatar');
  if (el) el.innerHTML = `<img src="${src}" alt="avatar" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--blue2)">`;
}

document.getElementById('pwdForm').onsubmit = async (e) => {
  e.preventDefault();
  const cur = document.getElementById('currentPwd').value;
  const nw  = document.getElementById('newPwd').value;
  const conf = document.getElementById('confirmPwd').value;
  if (!cur || !nw || !conf) return toasts.error('جميع الحقول مطلوبة');
  if (nw !== conf) return toasts.error('كلمة المرور الجديدة غير متطابقة');
  const btn = document.getElementById('pwdBtn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  try {
    await api.post('/api/profile/password', { currentPassword: cur, newPassword: nw });
    toasts.success('تم تغيير كلمة المرور ✓');
    document.getElementById('pwdForm').reset();
  } catch(e) { toasts.error(e.message || 'فشل تغيير كلمة المرور'); }
  finally { btn.disabled = false; btn.textContent = 'حفظ كلمة المرور'; }
};

async function loadNotifications() {
  try {
    const notifs = await api.get('/api/notifications');
    const el = document.getElementById('notifList');
    if (!notifs.length) {
      el.innerHTML = '<div class="empty"><p>لا توجد إشعارات</p></div>';
      return;
    }
    el.innerHTML = `<div style="padding:.5rem 0">${notifs.map(n => `
      <div class="notif-item ${n.isRead ? '' : 'notif-unread'}">
        <div class="notif-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="notif-content">
          <p class="notif-msg">${n.message}</p>
          <span class="notif-meta">من: ${n.senderName || 'النظام'} · ${fmtDate(n.createdAt)}</span>
        </div>
        ${!n.isRead ? '<span class="notif-badge-dot"></span>' : ''}
      </div>`).join('')}</div>`;
  } catch(e) {}
}

async function loadUnreadCount() {
  try {
    const { count } = await api.get('/api/notifications/unread');
    const dot = document.getElementById('notifDot');
    if (dot) dot.style.display = count > 0 ? 'block' : 'none';
  } catch(e) {}
}

async function markAllRead() {
  try {
    await api.post('/api/notifications/read', {});
    await loadNotifications();
    const dot = document.getElementById('notifDot');
    if (dot) dot.style.display = 'none';
    toasts.success('تم تحديد الكل كمقروء');
  } catch(e) { toasts.error('فشل التحديث'); }
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
